name: Build Nura for Xiaomi Mi MIX 2 (chiron)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ui:
        description: 'User Interface (UI)'
        required: true
        default: 'phosh'
        type: choice
        options:
          - phosh
          - console
          - plasma-mobile
          - sxmo-de-sway

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU and binfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo systemctl restart systemd-binfmt || true
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Install pmbootstrap
        run: |
          sudo apt-get install -y python3-pip git
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          sudo pip install --break-system-packages /tmp/pmbootstrap
          pmbootstrap --version

      - name: Configure pmbootstrap
        env:
          TARGET_UI: ${{ github.event.inputs.ui || 'phosh' }}
          PMB_CHANNELS_CFG: ${{ github.workspace }}/channels.cfg
        run: |
          echo "Selected UI: $TARGET_UI"
          python3 -c "
          import configparser, os
          cfg = configparser.ConfigParser()
          cfg['pmbootstrap'] = {
              'aports': os.environ['GITHUB_WORKSPACE'],
              'work': '/home/runner/work/pmbootstrap',
              'auto_zap_misconfigured_chroots': 'yes',
              'is_default_channel': 'True',
              'device': 'xiaomi-chiron',
              'ui': os.environ['TARGET_UI'],
              'jobs': '4',
              'user': 'user',
              'systemd': 'default',
          }
          cfg['providers'] = {}
          cfg['mirrors'] = {}
          with open('/tmp/pmbootstrap.cfg', 'w') as f:
              cfg.write(f)
          "
          mkdir -p /home/runner/work/pmbootstrap
          echo "8" > /home/runner/work/pmbootstrap/version
          sudo PMB_CHANNELS_CFG="${{ github.workspace }}/channels.cfg" pmbootstrap -c /tmp/pmbootstrap.cfg --as-root status

      - name: Pre-build device packages
        env:
          PMB_CHANNELS_CFG: ${{ github.workspace }}/channels.cfg
        run: |
          sudo PMB_CHANNELS_CFG="${{ github.workspace }}/channels.cfg" pmbootstrap -c /tmp/pmbootstrap.cfg --as-root build soc-qcom-msm8998
          sudo PMB_CHANNELS_CFG="${{ github.workspace }}/channels.cfg" pmbootstrap -c /tmp/pmbootstrap.cfg --as-root build firmware-xiaomi-chiron
          sudo PMB_CHANNELS_CFG="${{ github.workspace }}/channels.cfg" pmbootstrap -c /tmp/pmbootstrap.cfg --as-root build device-xiaomi-chiron

      - name: Build and install image
        env:
          PMB_CHANNELS_CFG: ${{ github.workspace }}/channels.cfg
        run: |
          sudo PMB_CHANNELS_CFG="${{ github.workspace }}/channels.cfg" pmbootstrap -c /tmp/pmbootstrap.cfg --as-root -y install --password user

      - name: Show pmbootstrap log on failure
        if: failure()
        run: |
          sudo tail -n 250 /home/runner/work/pmbootstrap/log.txt || true

      - name: Export flashable images
        env:
          PMB_CHANNELS_CFG: ${{ github.workspace }}/channels.cfg
        run: |
          mkdir -p export_links export_out
          sudo PMB_CHANNELS_CFG="${{ github.workspace }}/channels.cfg" pmbootstrap -c /tmp/pmbootstrap.cfg --as-root export export_links/
          sudo cp -rL export_links/* export_out/ || true
          cd export_out
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          sudo chown -R $USER:$USER .
          ls -lh

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nura-xiaomi-chiron-${{ github.event.inputs.ui || 'phosh' }}
          path: export_out/
